[package]
name = "cost-guard-core"
description = "Platform-independent core for OpenCode Cost Guard"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
ureq = { version = "3.5.0", features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
