[package]
name = "cost-guard-app"
description = "Cost Guard menu-bar app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4"
cost-guard-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
