[package]
name = "cost-guard-app"
description = "Cost Guard menu-bar app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = "0.4"
cost-guard-core = { path = "../core" }
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-notification = "2.7.0"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = "=2.7.4"
