# OpenCode Go Roster capability ratings.
#
# Flags and context lengths mirror models.dev metadata (the same feed the
# catalog mirror serves). Tier and profile scores are curated judgments:
#
#   frontier  top-end reasoning/coding models
#   strong    capable daily drivers, one step below the frontier
#   standard  efficient or older-generation models
#   light     small, free or narrowly scoped models
#
# Profile scores are 0-10 and only listed where the model could plausibly win
# that profile; unlisted profiles fall back to the tier base in scoring.
# Per-profile scores are human judgments from public model cards, benchmarks
# and the model descriptions published in the mirror.

schema = 1
source = "https://models.dev/api.json + public model cards"
last_verified = "2026-10-23"

